<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Overall network engineer capability model</title>
  <desc id="desc">Three complementary dimensions: professional knowledge, professional skills, and basic qualifications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbfc"/>
      <stop offset="1" stop-color="#e6f1f6"/>
    </linearGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06a8b5"/>
      <stop offset="1" stop-color="#08728e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#24495f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1400" height="860" rx="34" fill="url(#bg)"/>
  <text x="700" y="70" text-anchor="middle" fill="#102a43" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="43" font-weight="750">Overall capability model</text>
  <text x="700" y="111" text-anchor="middle" fill="#486b7c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23">A network engineer combines knowledge, skills, and professional qualities</text>

  <path d="M700 250 L250 350 M700 250 L700 350 M700 250 L1150 350" fill="none" stroke="#92b9c6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="700" cy="225" r="102" fill="url(#center)" filter="url(#shadow)"/>
  <circle cx="700" cy="225" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
  <text x="700" y="214" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">NETWORK</text>
  <text x="700" y="249" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="800">ENGINEER</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(70 350)">
      <rect width="360" height="390" rx="26" fill="#ffffff"/>
      <path d="M0 26 Q0 0 26 0 H334 Q360 0 360 26 V112 H0Z" fill="#087f96"/>
      <circle cx="180" cy="65" r="30" fill="#ffffff" opacity="0.16"/>
      <text x="180" y="60" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="800">PROFESSIONAL</text>
      <text x="180" y="89" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="800">KNOWLEDGE</text>
      <text x="42" y="158" fill="#17394d" font-size="21" font-weight="700">Understand the domain</text>
      <g fill="#3e6172" font-size="20">
        <text x="42" y="201">• Technologies and protocols</text>
        <text x="42" y="239">• Products and equipment</text>
        <text x="42" y="277">• Engineering and projects</text>
        <text x="42" y="315">• Industries and use cases</text>
        <text x="42" y="353">• Processes and standards</text>
      </g>
    </g>

    <g transform="translate(520 350)">
      <rect width="360" height="390" rx="26" fill="#ffffff"/>
      <path d="M0 26 Q0 0 26 0 H334 Q360 0 360 26 V112 H0Z" fill="#d38a00"/>
      <circle cx="180" cy="65" r="30" fill="#ffffff" opacity="0.16"/>
      <text x="180" y="60" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="800">PROFESSIONAL</text>
      <text x="180" y="89" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="800">SKILLS</text>
      <text x="42" y="158" fill="#17394d" font-size="21" font-weight="700">Act within the project</text>
      <g fill="#3e6172" font-size="20">
        <text x="42" y="201">• Communication</text>
        <text x="42" y="239">• Solution design</text>
        <text x="42" y="277">• Presentation</text>
        <text x="42" y="315">• Service management</text>
        <text x="42" y="353">• Team collaboration</text>
      </g>
    </g>

    <g transform="translate(970 350)">
      <rect width="360" height="390" rx="26" fill="#ffffff"/>
      <path d="M0 26 Q0 0 26 0 H334 Q360 0 360 26 V112 H0Z" fill="#375a7f"/>
      <circle cx="180" cy="65" r="30" fill="#ffffff" opacity="0.16"/>
      <text x="180" y="60" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="800">BASIC</text>
      <text x="180" y="89" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="800">QUALIFICATIONS</text>
      <text x="42" y="158" fill="#17394d" font-size="21" font-weight="700">Adopt the right mindset</text>
      <g fill="#3e6172" font-size="20">
        <text x="42" y="201">• Learning ability</text>
        <text x="42" y="239">• Information gathering</text>
        <text x="42" y="277">• Service mindset</text>
        <text x="42" y="315">• Professional values</text>
        <text x="42" y="353">• Professional etiquette</text>
      </g>
    </g>
  </g>

  <rect x="350" y="776" width="700" height="48" rx="24" fill="#102a43" opacity="0.07"/>
  <text x="700" y="807" text-anchor="middle" fill="#486b7c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">TianSemi - original learning summary based on HCIA-Datacom V2.0, PDF page 39</text>
</svg>
