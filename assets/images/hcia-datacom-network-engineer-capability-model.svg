<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Modèle global de compétences d'un ingénieur réseau</title>
  <desc id="desc">Trois dimensions complémentaires : connaissances professionnelles, compétences professionnelles et qualifications de base.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbfc"/>
      <stop offset="1" stop-color="#e6f1f6"/>
    </linearGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06a8b5"/>
      <stop offset="1" stop-color="#08728e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#24495f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1400" height="860" rx="34" fill="url(#bg)"/>
  <text x="700" y="70" text-anchor="middle" fill="#102a43" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="43" font-weight="750">Modèle global de compétences</text>
  <text x="700" y="111" text-anchor="middle" fill="#486b7c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23">Un ingénieur réseau associe savoirs, savoir-faire et posture professionnelle</text>

  <path d="M700 250 L250 350 M700 250 L700 350 M700 250 L1150 350" fill="none" stroke="#92b9c6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="700" cy="225" r="102" fill="url(#center)" filter="url(#shadow)"/>
  <circle cx="700" cy="225" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
  <text x="700" y="214" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">INGÉNIEUR</text>
  <text x="700" y="249" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="800">RÉSEAU</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(70 350)">
      <rect width="360" height="390" rx="26" fill="#ffffff"/>
      <path d="M0 26 Q0 0 26 0 H334 Q360 0 360 26 V112 H0Z" fill="#087f96"/>
      <circle cx="180" cy="65" r="30" fill="#ffffff" opacity="0.16"/>
      <text x="180" y="60" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">CONNAISSANCES</text>
      <text x="180" y="89" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">PROFESSIONNELLES</text>
      <text x="42" y="158" fill="#17394d" font-size="21" font-weight="700">Comprendre le domaine</text>
      <g fill="#3e6172" font-size="20">
        <text x="42" y="201">• Technologies et protocoles</text>
        <text x="42" y="239">• Produits et équipements</text>
        <text x="42" y="277">• Ingénierie et projets</text>
        <text x="42" y="315">• Secteurs et usages</text>
        <text x="42" y="353">• Processus et normes</text>
      </g>
    </g>

    <g transform="translate(520 350)">
      <rect width="360" height="390" rx="26" fill="#ffffff"/>
      <path d="M0 26 Q0 0 26 0 H334 Q360 0 360 26 V112 H0Z" fill="#d38a00"/>
      <circle cx="180" cy="65" r="30" fill="#ffffff" opacity="0.16"/>
      <text x="180" y="60" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">COMPÉTENCES</text>
      <text x="180" y="89" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">PROFESSIONNELLES</text>
      <text x="42" y="158" fill="#17394d" font-size="21" font-weight="700">Agir dans le projet</text>
      <g fill="#3e6172" font-size="20">
        <text x="42" y="201">• Communication</text>
        <text x="42" y="239">• Élaboration de solutions</text>
        <text x="42" y="277">• Présentation</text>
        <text x="42" y="315">• Gestion des services</text>
        <text x="42" y="353">• Collaboration en équipe</text>
      </g>
    </g>

    <g transform="translate(970 350)">
      <rect width="360" height="390" rx="26" fill="#ffffff"/>
      <path d="M0 26 Q0 0 26 0 H334 Q360 0 360 26 V112 H0Z" fill="#375a7f"/>
      <circle cx="180" cy="65" r="30" fill="#ffffff" opacity="0.16"/>
      <text x="180" y="60" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">QUALIFICATIONS</text>
      <text x="180" y="89" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">DE BASE</text>
      <text x="42" y="158" fill="#17394d" font-size="21" font-weight="700">Adopter la bonne posture</text>
      <g fill="#3e6172" font-size="20">
        <text x="42" y="201">• Capacité d'apprentissage</text>
        <text x="42" y="239">• Collecte d'informations</text>
        <text x="42" y="277">• Sens du service</text>
        <text x="42" y="315">• Valeurs professionnelles</text>
        <text x="42" y="353">• Étiquette professionnelle</text>
      </g>
    </g>
  </g>

  <rect x="350" y="776" width="700" height="48" rx="24" fill="#102a43" opacity="0.07"/>
  <text x="700" y="807" text-anchor="middle" fill="#486b7c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">TianSemi - synthèse pédagogique originale d'après HCIA-Datacom V2.0, page PDF 39</text>
</svg>
