<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Topologie Datacom d'un petit réseau d'entreprise</title>
  <desc id="desc">PC et AP reliés à un switch d'accès, puis à un routeur, un firewall et Internet, avec serveur interne et WAC.</desc>
  <rect width="1200" height="680" rx="32" fill="#0f172a"/>
  <defs>
    <linearGradient id="node" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#172554"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="wan" x1="0" x2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="lan" x1="0" x2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  </defs>
  <text x="60" y="68" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Lire une topologie avant de configurer</text>
  <text x="60" y="106" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">Le chemin d'un utilisateur vers Internet passe par plusieurs rôles réseau distincts.</text>
  <g stroke="#475569" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M225 250h175"/>
    <path d="M520 250h150"/>
    <path d="M790 250h130"/>
    <path d="M225 430h175"/>
    <path d="M520 430h150"/>
    <path d="M460 310v70"/>
    <path d="M460 250v-92h230"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(135 250)"><rect x="-85" y="-62" width="170" height="124" rx="22" fill="url(#node)" stroke="#334155"/><text y="-8" fill="#f8fafc" font-size="23" font-weight="800">PCs</text><text y="24" fill="#cbd5e1" font-size="15">terminaux</text></g>
    <g transform="translate(460 250)"><rect x="-92" y="-68" width="184" height="136" rx="22" fill="url(#node)" stroke="#2dd4bf" stroke-width="3"/><text y="-11" fill="#f8fafc" font-size="23" font-weight="800">Switch</text><text y="23" fill="#cbd5e1" font-size="15">accès LAN</text></g>
    <g transform="translate(730 250)"><rect x="-82" y="-62" width="164" height="124" rx="22" fill="url(#node)" stroke="#38bdf8" stroke-width="3"/><text y="-8" fill="#f8fafc" font-size="23" font-weight="800">Routeur</text><text y="24" fill="#cbd5e1" font-size="15">réseaux IP</text></g>
    <g transform="translate(985 250)"><rect x="-92" y="-68" width="184" height="136" rx="22" fill="url(#node)" stroke="#f97316" stroke-width="3"/><text y="-11" fill="#f8fafc" font-size="23" font-weight="800">Firewall</text><text y="23" fill="#cbd5e1" font-size="15">filtrage</text></g>
    <g transform="translate(135 430)"><rect x="-85" y="-62" width="170" height="124" rx="22" fill="url(#node)" stroke="#334155"/><text y="-8" fill="#f8fafc" font-size="23" font-weight="800">AP</text><text y="24" fill="#cbd5e1" font-size="15">Wi‑Fi</text></g>
    <g transform="translate(460 430)"><rect x="-92" y="-68" width="184" height="136" rx="22" fill="url(#node)" stroke="#22c55e" stroke-width="3"/><text y="-11" fill="#f8fafc" font-size="23" font-weight="800">Serveur</text><text y="23" fill="#cbd5e1" font-size="15">service interne</text></g>
    <g transform="translate(730 430)"><rect x="-82" y="-62" width="164" height="124" rx="22" fill="url(#node)" stroke="#a78bfa" stroke-width="3"/><text y="-8" fill="#f8fafc" font-size="23" font-weight="800">WAC</text><text y="24" fill="#cbd5e1" font-size="15">contrôle AP</text></g>
    <g transform="translate(1035 500)"><ellipse rx="105" ry="58" fill="#172554" stroke="url(#wan)" stroke-width="4"/><text y="-5" fill="#f8fafc" font-size="24" font-weight="800">Internet</text><text y="28" fill="#cbd5e1" font-size="15">WAN</text></g>
  </g>
  <path d="M1010 325c55 42 64 72 45 112" stroke="url(#wan)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M1030 392l25 45 34-38" stroke="url(#wan)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="60" y="570" width="1080" height="56" rx="18" fill="#111827" stroke="#334155"/>
  <text x="600" y="606" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="18">Diagnostic : terminal → lien d'accès → switch → IP/routage → firewall → service</text>
</svg>