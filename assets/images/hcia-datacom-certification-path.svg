<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Parcours de certification Huawei Datacom</title>
  <desc id="desc">Progression en trois niveaux : HCIA-Datacom, HCIP-Datacom et HCIE-Datacom.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2c"/>
      <stop offset="1" stop-color="#15415a"/>
    </linearGradient>
    <linearGradient id="hcia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15b9c4"/>
      <stop offset="1" stop-color="#087c96"/>
    </linearGradient>
    <linearGradient id="hcip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4be28"/>
      <stop offset="1" stop-color="#d88a00"/>
    </linearGradient>
    <linearGradient id="hcie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef6a59"/>
      <stop offset="1" stop-color="#bd3243"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00111f" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#c6edf1"/>
    </marker>
  </defs>

  <rect width="1400" height="780" rx="34" fill="url(#bg)"/>
  <circle cx="1240" cy="90" r="190" fill="#ffffff" opacity="0.04"/>
  <text x="700" y="76" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="43" font-weight="750">Parcours de certification Huawei Datacom</text>
  <text x="700" y="118" text-anchor="middle" fill="#b9d9e6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23">Associate → Professional → Expert</text>

  <path d="M170 630 C430 610, 700 470, 1130 205" fill="none" stroke="#c6edf1" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 14" marker-end="url(#arrow)" opacity="0.8"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(90 390)">
      <rect width="365" height="270" rx="28" fill="url(#hcia)"/>
      <rect x="28" y="28" width="112" height="44" rx="22" fill="#ffffff" opacity="0.18"/>
      <text x="84" y="58" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="750">ASSOCIATE</text>
      <text x="38" y="122" fill="#ffffff" font-size="36" font-weight="800">HCIA-Datacom</text>
      <line x1="38" y1="145" x2="327" y2="145" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
      <text x="38" y="186" fill="#ffffff" font-size="22" font-weight="650">Théories fondamentales</text>
      <text x="38" y="221" fill="#ffffff" font-size="22">et compétences de</text>
      <text x="38" y="253" fill="#ffffff" font-size="22">déploiement de base</text>
    </g>

    <g transform="translate(518 285)">
      <rect width="365" height="300" rx="28" fill="url(#hcip)"/>
      <rect x="28" y="28" width="145" height="44" rx="22" fill="#ffffff" opacity="0.2"/>
      <text x="100" y="58" text-anchor="middle" fill="#3a2800" font-size="18" font-weight="800">PROFESSIONAL</text>
      <text x="38" y="126" fill="#342600" font-size="36" font-weight="800">HCIP-Datacom</text>
      <line x1="38" y1="149" x2="327" y2="149" stroke="#342600" stroke-opacity="0.28" stroke-width="2"/>
      <text x="38" y="192" fill="#342600" font-size="22" font-weight="700">Connaissances avancées</text>
      <text x="38" y="227" fill="#342600" font-size="22">et compétences de</text>
      <text x="38" y="259" fill="#342600" font-size="22">déploiement Datacom</text>
    </g>

    <g transform="translate(946 170)">
      <rect width="365" height="330" rx="28" fill="url(#hcie)"/>
      <rect x="28" y="28" width="100" height="44" rx="22" fill="#ffffff" opacity="0.2"/>
      <text x="78" y="58" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">EXPERT</text>
      <text x="38" y="127" fill="#ffffff" font-size="36" font-weight="800">HCIE-Datacom</text>
      <line x1="38" y1="151" x2="327" y2="151" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
      <text x="38" y="195" fill="#ffffff" font-size="22" font-weight="700">Fondation théorique solide</text>
      <text x="38" y="230" fill="#ffffff" font-size="22">et déploiement de solutions</text>
      <text x="38" y="262" fill="#ffffff" font-size="22">interdomaines</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#d7f4f6">
    <text x="272" y="704" text-anchor="middle">FONDAMENTAUX</text>
    <text x="700" y="704" text-anchor="middle">APPROFONDISSEMENT</text>
    <text x="1128" y="704" text-anchor="middle">MAÎTRISE</text>
  </g>
  <text x="700" y="752" text-anchor="middle" fill="#87b7c7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">TianSemi - synthèse pédagogique originale d'après HCIA-Datacom V2.0, page PDF 42</text>
</svg>
