<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Flux simple d'un réseau Datacom</title>
  <desc id="desc">Une source envoie des données à une destination à travers un canal réseau composé de supports et équipements.</desc>
  <rect width="1200" height="520" rx="32" fill="#101827"/>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14233f"/>
      <stop offset="1" stop-color="#0d1324"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <text x="70" y="70" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Source → Canal → Destination</text>
  <text x="70" y="108" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">Le premier modèle mental à maîtriser en HCIA-Datacom.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="175" width="250" height="190" rx="24" fill="url(#panel)" stroke="#334155"/>
    <circle cx="195" cy="235" r="42" fill="#1e293b" stroke="#2dd4bf" stroke-width="4"/>
    <rect x="166" y="286" width="58" height="38" rx="8" fill="#2dd4bf" opacity="0.9"/>
    <text x="195" y="405" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Source</text>
    <text x="195" y="434" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">PC, serveur, smartphone</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="475" y="150" width="250" height="240" rx="24" fill="url(#panel)" stroke="#334155"/>
    <path d="M535 248h130" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="555" cy="248" r="18" fill="#2dd4bf"/>
    <circle cx="600" cy="248" r="18" fill="#f8fafc"/>
    <circle cx="645" cy="248" r="18" fill="#fbbf24"/>
    <path d="M600 196v104" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10"/>
    <text x="600" y="430" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Canal</text>
    <text x="600" y="459" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">Câble, fibre, Wi‑Fi, réseau opérateur</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="880" y="175" width="250" height="190" rx="24" fill="url(#panel)" stroke="#334155"/>
    <rect x="953" y="214" width="104" height="80" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="4"/>
    <rect x="980" y="307" width="50" height="12" rx="6" fill="#fbbf24"/>
    <text x="1005" y="405" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Destination</text>
    <text x="1005" y="434" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">Application, serveur, imprimante</text>
  </g>
  <path d="M340 265h105" stroke="#64748b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M755 265h95" stroke="#64748b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#64748b"/>
    </marker>
  </defs>
</svg>